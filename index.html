<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain</title>
  <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
  <link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- icons: non-blocking, so first paint/rain does not wait for the CSS+font download -->
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #root {
      position: absolute;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
    }
    #canvas {
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }
    #loading {
      position: absolute;
      z-index: 999;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      position: relative;
    }
    .spinner::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #00fffc;
      border-radius: 50%;
      animation: neonRipple 2s ease-out infinite;
      box-shadow: 0 0 10px #00fffc, inset 0 0 10px #00fffc;
    }
    @keyframes neonRipple {
      0% { transform: scale(0.1); opacity: 1; filter: brightness(1); }
      100% { transform: scale(1.8); opacity: 0; filter: brightness(2); }
    }

    /* Control Panel */
    .control-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.20);
      border-radius: 15px;
      padding: 20px;
      color: white;
      width: 350px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
      /* filter is switched off only after the fade-out ends (0.3s delay) */
      transition: transform 0.3s ease, opacity 0.3s ease, backdrop-filter 0s linear 0.3s;
      transform: translateX(calc(100% - 40px));
      opacity: 0;
      box-sizing: border-box;
    }

    .control-panel.show {
      transform: translateX(0);
      opacity: 1;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition-delay: 0s, 0s, 0s;
    }

    .control-panel::after {
      content: '⚙️';
      position: absolute;
      left: -40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .control-panel.show::after {
      opacity: 0;
    }

    .control-group {
      margin-bottom: 0;
      gap: 3px;
    }

    .control-label {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 14px;
      width: 100%;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #dad9f5;
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #dad9f5;
      cursor: pointer;
      border: none;
    }

    .toggle-button {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .toggle-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .toggle-button.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px 0;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    .preset-btn.active {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 1px #cacaca;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .preset-btn:active {
      transform: scale(0.95);
    }

    .bg-video {
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    #fullscreenBtn {
      padding: 10px 15px;
    }




    #mistToggle,
    #autoNextToggle {
      min-width: 60px;
      text-align: center;
      white-space: nowrap;
    }

    #videoUrlInput {
      font-size: 12px;
    }

    #videoUrlInput::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #videoUrlInput:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 1px #cacaca;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }

    .control-panel.shake {
      animation: shake 0.5s ease-in-out;
    }

    #dropzone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: rgba(0,0,0,0.7);
      z-index: 500;
      justify-content: center;
      align-items: center;
    }

    #dropzone.active {
      display: flex;
    }

    .drop-content {
      padding: 30px;
      background: rgba(0,0,0,0.8);
      border-radius: 15px;
      border: 2px dashed white;
      color: white;
      font-size: 20px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .control-panel {
        max-width: calc(100vw - 40px);
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 20px;
        transform: translateY(calc(100% - 40px));
      }

      .control-panel::after {
        left: 50%;
        top: -40px;
        transform: translateX(-50%);
      }

      .control-panel:hover,
      .control-panel:focus-within {
        transform: translateY(0);
      }

      .header h1 {
        font-size: 20px;
      }

      .presets {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="canvas-wrapper" style="position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden;">
      <canvas id="canvas"></canvas>
    </div>
    
    <div id="loading">
      <div class="spinner"></div>
    </div>

    <div id="dropzone">
      <div class="drop-content">
        <i class="fas fa-cloud-upload-alt" style="font-size: 48px; margin-bottom: 15px;"></i>
        <br><span id="dropzoneText">Drop Image Here</span>
      </div>
    </div>

    <!-- Hidden video elements (double-buffered in JS) used as texture source -->
    <video id="backgroundVideo" class="bg-video" muted playsinline crossorigin="anonymous"></video>

    <div class="control-panel" tabindex="0">
      <div class="header">
        <h1><i class="fas fa-tint"></i> Raindrop FX</h1>
      </div>

      <div class="control-group">
        <button class="preset-btn" id="fullscreenBtn" style="width: 100%; grid-column: 1 / -1; margin-bottom: 10px;">
          <i class="fas fa-expand"></i> Enter Fullscreen
        </button>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Rain Intensity</span>
          <span id="dropletsPerSecondValue">1000</span>
        </div>
        <input type="range" min="100" max="3000" value="1000" class="slider" id="dropletsPerSecond">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Rain Size</span>
          <span id="spawnSizeValue">[30, 80]</span>
        </div>
        <input type="range" min="10" max="150" value="55" class="slider" id="spawnSize">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Slip Rate</span>
          <span id="slipRateValue">0.50</span>
        </div>
        <input type="range" min="0" max="100" value="50" class="slider" id="slipRate">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Gravity</span>
          <span id="gravityValue">2400</span>
        </div>
        <input type="range" min="1000" max="5000" value="2400" class="slider" id="gravity">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Mist Effect</span>
          <button id="mistToggle" class="toggle-button active">ON</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label" style="gap: 8px;">
          <span>Video Control</span>
            <button id="videoPlayPauseBtn" class="toggle-button" style="width: 60px; min-width: 60px;" title="Play/Pause video">
                <i class="fas fa-play"></i>
            </button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Auto Next Video</span>
          <button id="autoNextToggle" class="toggle-button" title="Switch to a new random video every 45s">OFF</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label" style="gap: 8px;">
          <span>URL</span>
          <input 
            type="text" 
            id="videoUrlInput" 
            placeholder="Paste video URL..."
            value="https://www.shutterstock.com/shutterstock/videos/4018923955/preview/stock-footage-green-landscape-view-of-trees-in-forest.webm"
            style="flex: 1; height: 22px;padding: 6px 10px; border-radius: 20px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 12px;"
          >
          <button id="videoLoadBtn" class="toggle-button" style="min-width: 60px;" title="Load video">
            <i class="fas fa-download"></i> 
          </button>
        </div>
      </div>

      <div class="presets">
        <button class="preset-btn" data-preset="light"><i class="fas fa-cloud-sun"></i> Light Rain</button>
        <button class="preset-btn" data-preset="heavy"><i class="fas fa-cloud-rain"></i> Heavy Rain</button>
        <button class="preset-btn" data-preset="storm"><i class="fas fa-bolt"></i> Storm</button>
        <button class="preset-btn" data-preset="norain"><i class="fas fa-sun"></i> No Rain</button>
        <button class="preset-btn" id="changeBgBtn"><i class="fas fa-random"></i> Random Image</button>
        <button class="preset-btn" id="customBgBtn"><i class="fas fa-image"></i> Load Image</button>
        <button class="preset-btn" id="randomVideoBtn"><i class="fas fa-film"></i> Random Video</button>
        <button class="preset-btn" id="videoUploadBtn"><i class="fas fa-video"></i> Load Video</button>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
  <script>
(() => {
  'use strict';

  /* ======================================================================
   * CONFIG
   * ==================================================================== */
  const CONFIG = {
    MAX_IMAGE_SIDE: 2560,         // user-supplied images larger than this are down-scaled once
    MAX_VIDEO_W: 640,             // video texture size cap (unchanged)
    MAX_VIDEO_H: 360,
    MAX_FPS: 60,                  // render/simulation cap
    MAX_VIDEO_FPS: 30,            // max background-texture updates per second
    IMAGE_TIMEOUT: 10000,
    VIDEO_TIMEOUT: 12000,
    MAX_ATTEMPTS: 8,              // random image / random video: tries before giving up
    AUTO_NEXT_MS: 45000,          // "Auto Next Video" interval
    HISTORY_SIZE: 30,             // do not repeat the last N videos
    POOL_MAX: 400,
    GITHUB_LIST: 'https://raw.githubusercontent.com/maplemonday/rain/refs/heads/main/vid_for_rain.txt',
    // Optional: free key from https://www.pexels.com/api/  (or localStorage.setItem('pexelsKey', '...'))
    PEXELS_API_KEY: '',
    // Keyless online source (Wikimedia Commons). One random term is used per refill.
    // Themed for "rain on a window": calm scenery / city / nature, fixed camera, no people
    COMMONS_QUERIES: [
      'rainy street', 'rain window', 'rainforest', 'misty forest', 'bamboo forest', 'forest stream',
      'waterfall', 'lake view', 'mountain landscape', 'foggy mountains', 'city night skyline',
      'city lights night', 'harbor night', 'garden', 'cloudy sky', 'sunset sky', 'snowy forest', 'autumn forest'
    ],
    IMAGE_QUERIES: [
      'rainy street', 'misty forest', 'rainforest', 'bamboo forest', 'lake mist', 'mountain landscape',
      'foggy mountains', 'city night skyline', 'city lights night', 'harbor night', 'garden pond',
      'cloudy sky', 'sunset sky', 'snowy forest', 'autumn forest', 'waterfall', 'rice field', 'temple garden'
    ],
    // words that usually mean camera movement or people -> excluded from the search
    EXCLUDE_VIDEO: '-drone -aerial -pan -panning -hyperlapse -driving -flight -walk -walking -tour -timelapse -portrait -interview',
    EXCLUDE_IMAGE: '-portrait -people -person -man -woman -selfie -crowd -aerial',
    // static-camera check (mean luma change 0..255 between samples ~0.35s apart on a 32x18 frame)
    STATIC_MAX_MEAN_DIFF: 6,
    STATIC_SAMPLES: 4,
    PEXELS_QUERIES: ['rain window', 'rainy street', 'forest rain', 'bamboo rain', 'lake', 'mountain fog', 'city night', 'cloudy sky']
  };

  const CURATED_VIDEOS = [
    'https://www.shutterstock.com/shutterstock/videos/4018923955/preview/stock-footage-green-landscape-view-of-trees-in-forest.webm',
    'https://www.shutterstock.com/shutterstock/videos/3838797647/preview/stock-footage-fresh-green-giant-bamboo-leaves-with-rain-drop-nature-background-raindrops-falling-on-bamboo.webm',
    'https://videos.pexels.com/video-files/32221425/13742369_1080_1920_30fps.mp4'
  ];

  /* ======================================================================
   * DOM + small utils
   * ==================================================================== */
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const loadingEl = $('loading');
  const dropzone = $('dropzone');
  const root = $('root');
  const fullscreenBtn = $('fullscreenBtn');
  const controlPanel = document.querySelector('.control-panel');
  const playPauseBtn = $('videoPlayPauseBtn');
  const autoNextBtn = $('autoNextToggle');
  const urlInput = $('videoUrlInput');

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const isVideoUrl = (u) => /\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(u);
  const slowNetwork = () => {
    const c = navigator.connection;
    return !!c && (c.saveData || /2g|3g/.test(c.effectiveType || ''));
  };
  const timeoutSignal = (ms) => (window.AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);

  // spinner: shown only if loading takes > 250ms (no flicker for cached/prefetched items)
  let loadingCount = 0, loadingTimer = 0;
  function showLoading() {
    if (++loadingCount === 1) loadingTimer = setTimeout(() => { loadingEl.style.display = 'flex'; }, 250);
  }
  function hideLoading() {
    if (loadingCount > 0 && --loadingCount === 0) {
      clearTimeout(loadingTimer);
      loadingEl.style.display = 'none';
    }
  }

  function shake() {
    controlPanel.classList.remove('shake');
    void controlPanel.offsetWidth;
    controlPanel.classList.add('shake');
    setTimeout(() => controlPanel.classList.remove('shake'), 200);
  }

  // One token for "what the user asked for last". Any newer request makes older ones stale,
  // so overlapping loads (spam-clicking, tap + button, ...) can never fight each other.
  let reqToken = 0;

  /* ======================================================================
   * RaindropFX instance (created once, lazily, with the first background)
   * ==================================================================== */
  let fx = null;
  let fxCreating = null;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.floor(rect.width), h = Math.floor(rect.height);
    if (!w || !h || (w === canvas.width && h === canvas.height)) return;
    if (fx && typeof fx.resize === 'function') fx.resize(w, h);   // lib resizes the canvas itself
    else { canvas.width = w; canvas.height = h; }
  }
  let resizeTimer = 0;
  window.addEventListener('resize', () => {              // debounced: resizing rebuilds 6 GPU textures
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 100);
  });

  function createFx(background) {
    if (fx) return Promise.resolve(fx);
    if (fxCreating) return fxCreating;
    fxCreating = (async () => {
      resizeCanvas();
      const inst = new RaindropFX({
        canvas,
        background,
        maxFps: CONFIG.MAX_FPS,
        dropletsPerSecond: 1000,
        spawnSize: [30, 80],
        spawnInterval: [0.1, 0.2],
        slipRate: 0.5,
        motionInterval: [0.5, 1.0],
        xShifting: [0.02, 0.08],
        colliderSize: 0.9,
        trailDropDensity: 0.2,
        trailDropSize: [0.3, 0.5],
        trailDistance: [30, 50],
        trailSpread: 0.5,
        initialSpread: 0.5,
        shrinkRate: 0.015,
        velocitySpread: 0.3,
        evaporate: 20,
        gravity: 2400,
        backgroundBlurSteps: 3,
        mist: true,
        mistColor: [0.01, 0.01, 0.01, 1],
        mistTime: 0.5,
        mistBlurStep: 4,
        dropletSize: [5, 20],
        smoothRaindrop: [0.97, 1.0],
        refractBase: 0.6,
        refractScale: 0.8,
        raindropCompose: 'smoother',
        raindropLightPos: [-1, 1, 2, 0],
        raindropDiffuseLight: [0.3, 0.3, 0.3],
        raindropShadowOffset: 0.7,
        raindropEraserSize: [0.95, 1.0],
        raindropSpecularLight: [0, 0, 0],
        raindropSpecularShininess: 32,
        raindropLightBump: 0.6
      });
      await inst.start();            // assets loaded before anything else touches the instance
      fx = inst;
      applyPreset('heavy');
      return inst;
    })().finally(() => { fxCreating = null; });
    return fxCreating;
  }

  async function applyBackground(source) {
    if (!fx) await createFx(source);
    else await fx.setBackground(source);
  }

  /* ======================================================================
   * IMAGES
   * ==================================================================== */
  function loadImage(url, timeoutMs = CONFIG.IMAGE_TIMEOUT) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.decoding = 'async';
      const timer = setTimeout(() => {
        img.onload = img.onerror = null;
        img.removeAttribute('src');                       // abort the request
        reject(new Error('Image load timeout'));
      }, timeoutMs);
      img.onload = () => {
        clearTimeout(timer);
        // decode off the main thread so the GPU upload does not stall a frame
        (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => resolve(img));
      };
      img.onerror = () => { clearTimeout(timer); reject(new Error('Image load failed')); };
      img.src = url;
    });
  }

  // Huge user photos are shrunk once (the background is shown blurred at screen size anyway)
  function fitForGpu(img) {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const max = CONFIG.MAX_IMAGE_SIDE;
    if (Math.max(w, h) <= max) return { source: img, dispose() {} };
    const k = max / Math.max(w, h);
    const c = document.createElement('canvas');
    c.width = Math.round(w * k);
    c.height = Math.round(h * k);
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);
    return { source: c, dispose() { c.width = c.height = 0; } };
  }

  async function setImage(img) {
    const { source, dispose } = fitForGpu(img);
    try {
      stopVideo();
      await applyBackground(source);
    } finally { dispose(); }
  }

  /* ---------- themed image pool (Wikimedia Commons, no key, CORS ok) ---------- */
  const imagePool = new Set(), badImages = new Set(), imageHistory = [];
  let imageRefilling = null;

  async function fetchCommonsImages() {
    const term = pickRandom(CONFIG.IMAGE_QUERIES);
    const query = async (extra, offset) => {
      const qs = new URLSearchParams({
        action: 'query', format: 'json', formatversion: '2', origin: '*',
        generator: 'search', gsrsearch: `${term} filetype:bitmap ${CONFIG.EXCLUDE_IMAGE} ${extra}`.trim(),
        gsrnamespace: '6', gsrlimit: '40', gsroffset: String(offset),
        prop: 'imageinfo', iiprop: 'url|size|mime', iiurlwidth: '800'
      });
      const res = await fetch('https://commons.wikimedia.org/w/api.php?' + qs, { signal: timeoutSignal(8000) });
      if (!res.ok) throw new Error('Commons HTTP ' + res.status);
      const json = await res.json();
      return (json.query && json.query.pages) || [];
    };
    let pages = await query('incategory:"Quality images"', Math.floor(Math.random() * 60));
    if (!pages.length) pages = await query('', Math.floor(Math.random() * 60));
    if (!pages.length) pages = await query('', 0);
    const urls = [];
    for (const p of pages) {
      const i = (p.imageinfo || [])[0];
      // landscape JPEGs only (fills the screen with "cover"); thumbnail keeps the download small
      if (i && i.mime === 'image/jpeg' && i.width >= 1200 && i.width >= i.height * 1.2 && (i.thumburl || i.url)) urls.push(i.thumburl || i.url);
    }
    return urls;
  }

  function refillImages() {
    if (imageRefilling) return imageRefilling;
    imageRefilling = fetchCommonsImages()
      .then((u) => { u.forEach((x) => { if (!badImages.has(x)) imagePool.add(x); }); })
      .catch((e) => console.warn('Image source failed:', e.message || e))
      .finally(() => { imageRefilling = null; });
    return imageRefilling;
  }

  async function nextImageUrl() {
    const pick = () => {
      const alive = [...imagePool].filter((u) => !badImages.has(u));
      const fresh = alive.filter((u) => !imageHistory.includes(u));
      if (fresh.length < 5) refillImages();                       // top up in background
      const list = fresh.length ? fresh : alive;
      return list.length ? pickRandom(list) : null;
    };
    let url = pick();
    if (!url) { await refillImages(); url = pick(); }
    if (url) { imageHistory.push(url); while (imageHistory.length > CONFIG.HISTORY_SIZE) imageHistory.shift(); imagePool.delete(url); }
    return url;
  }

  async function loadThemedImage() {
    const url = await nextImageUrl();
    if (!url) throw new Error('No image source available');
    try { return await loadImage(url); } catch (e) { badImages.add(url); throw e; }
  }

  // Next themed image is downloaded in the background => tap/click feels instant
  let prefetched = null;
  function prefetchImage() {
    if (prefetched || slowNetwork()) return;
    const p = loadThemedImage();
    prefetched = p;
    p.catch(() => { if (prefetched === p) prefetched = null; });
  }
  async function takePrefetchedImage() {
    const p = prefetched;
    prefetched = null;
    return p ? p.catch(() => null) : null;
  }

  function makeFallbackBackground() {       // used only if every online attempt failed (offline)
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#1b2a41'); grad.addColorStop(0.5, '#324a5f'); grad.addColorStop(1, '#0c1821');
    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 512);
    return c;
  }

  // loader() -> Promise<HTMLImageElement>. Retries use a NEW loader() call (new random URL for random mode).
  async function showImage(loader, { attempts = 1 } = {}) {
    const token = ++reqToken;
    showLoading();
    try {
      for (let i = 0; i < attempts; i++) {
        let img = null;
        try { img = await loader(); } catch (err) { console.warn(`Image attempt #${i + 1} failed:`, err.message || err); }
        if (token !== reqToken) return false;                   // superseded by a newer request
        if (img) {
          await setImage(img);
          prefetchImage();
          return true;
        }
        if (i < attempts - 1) { await sleep(300 * 2 ** i); if (token !== reqToken) return false; }
      }
      if (!fx) await applyBackground(makeFallbackBackground());   // offline: still start the rain
      shake();
      return false;
    } finally { hideLoading(); }
  }

  const showRandomImage = () =>
    showImage(async () => (await takePrefetchedImage()) || loadThemedImage(), { attempts: CONFIG.MAX_ATTEMPTS });

  async function showImageFile(file) {
    const url = URL.createObjectURL(file);       // no base64 (FileReader) round-trip
    try { await showImage(() => loadImage(url)); }
    finally { URL.revokeObjectURL(url); }
  }

  /* ======================================================================
   * VIDEO  (double-buffered, one frame pump, never stacks loops)
   * ==================================================================== */
  const videoCanvas = document.createElement('canvas');
  const vctx = videoCanvas.getContext('2d', { alpha: false });

  let mode = 'image';                // 'image' | 'video'
  let autoNext = false;
  let activeIdx = 0;

  function makeSlot(el) {
    el.muted = true; el.defaultMuted = true; el.volume = 0; el.loop = true;
    el.playsInline = true; el.preload = 'auto'; el.crossOrigin = 'anonymous';
    el.disablePictureInPicture = true; el.disableRemotePlayback = true;
    el.setAttribute('muted', ''); el.setAttribute('playsinline', '');
    const slot = { el, url: null, objectUrl: null, loading: null };
    const sync = () => { if (slot === activeSlot()) updatePlayButton(); };
    el.addEventListener('play', sync);
    el.addEventListener('pause', sync);
    el.addEventListener('ended', sync);
    el.addEventListener('error', () => {         // mid-playback failure -> move on silently
      if (slot === activeSlot() && mode === 'video' && !slot.loading && el.getAttribute('src')) {
        console.warn('Video playback error, switching:', el.error && el.error.message);
        randomVideo();
      }
    });
    return slot;
  }
  const extraEl = document.createElement('video');
  extraEl.className = 'bg-video';
  document.body.appendChild(extraEl);
  const slots = [makeSlot($('backgroundVideo')), makeSlot(extraEl)];
  const activeSlot = () => slots[activeIdx];
  const standbySlot = () => slots[1 - activeIdx];

  function resetSlot(slot) {                      // abort network, free decoder + blob URL
    if (slot.loading) { slot.loading.cancel(); slot.loading = null; }
    const el = slot.el;
    try { el.pause(); } catch (_) { /* ignore */ }
    el.removeAttribute('src');                    // NOT src='' (that re-requests the page URL)
    el.load();
    if (slot.objectUrl) { URL.revokeObjectURL(slot.objectUrl); slot.objectUrl = null; }
    slot.url = null;
  }

  // Resolves 'ok' | 'fail' | 'cancel' (never rejects). Result is kept in slot.loading until activated.
  function startLoad(slot, url, objectUrl = null) {
    let cancel;
    const promise = new Promise((resolve) => {
      const el = slot.el;
      let settled = false;
      const finish = (r) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        el.removeEventListener('loadeddata', onOk);
        el.removeEventListener('error', onErr);
        resolve(r);
      };
      const onOk = () => finish('ok');
      const onErr = () => finish('fail');
      const timer = setTimeout(() => finish('fail'), CONFIG.VIDEO_TIMEOUT);
      cancel = () => finish('cancel');
      el.addEventListener('loadeddata', onOk);
      el.addEventListener('error', onErr);
      slot.url = url;
      slot.objectUrl = objectUrl;
      el.src = url;
      el.load();
    });
    slot.loading = { url, promise, cancel };
    promise.then((r) => {
      if (r === 'fail' && slot.loading && slot.loading.promise === promise) {
        slot.loading = null;
        badVideos.add(url);
        resetSlot(slot);
      }
    });
    return promise;
  }

  function sizeVideoCanvas(el) {              // same size rule as before: <= 640x360, aspect kept
    const vw = el.videoWidth || CONFIG.MAX_VIDEO_W, vh = el.videoHeight || CONFIG.MAX_VIDEO_H;
    const aspect = vw / vh;
    let w = Math.min(vw, CONFIG.MAX_VIDEO_W), h = Math.min(vh, CONFIG.MAX_VIDEO_H);
    if (w / h > aspect) w = h * aspect; else h = w / aspect;
    const W = Math.max(2, Math.floor(w)), H = Math.max(2, Math.floor(h));
    if (videoCanvas.width !== W || videoCanvas.height !== H) { videoCanvas.width = W; videoCanvas.height = H; }
  }

  function pushFrame(el) {
    if (!fx || el.readyState < 2 || !el.videoWidth) return;
    try {
      vctx.drawImage(el, 0, 0, videoCanvas.width, videoCanvas.height);
      if (typeof fx.setBackgroundFrame === 'function') fx.setBackgroundFrame(videoCanvas);
      else fx.setBackground(videoCanvas);
    } catch (err) { console.error('Video frame error:', err); }
  }

  // Exactly ONE pump at a time. Uses requestVideoFrameCallback => work only when the video has a NEW frame.
  let pumpGen = 0, pumpCancel = null;
  function stopPump() {
    pumpGen++;
    if (pumpCancel) { pumpCancel(); pumpCancel = null; }
  }
  function startPump(slot) {
    stopPump();
    const el = slot.el, gen = pumpGen;
    const minGap = 1000 / CONFIG.MAX_VIDEO_FPS - 5;
    let last = -1e9;
    sizeVideoCanvas(el);
    pushFrame(el);
    if (typeof el.requestVideoFrameCallback === 'function') {
      let h = 0;
      const tick = (now) => {
        if (gen !== pumpGen) return;
        if (now - last >= minGap) { last = now; pushFrame(el); }
        h = el.requestVideoFrameCallback(tick);
      };
      h = el.requestVideoFrameCallback(tick);
      pumpCancel = () => { try { el.cancelVideoFrameCallback(h); } catch (_) { /* ignore */ } };
    } else {                                           // fallback (older browsers)
      let h = 0, lastTime = -1;
      const tick = (t) => {
        if (gen !== pumpGen) return;
        h = requestAnimationFrame(tick);
        if (t - last < minGap || el.currentTime === lastTime) return;
        last = t; lastTime = el.currentTime;
        pushFrame(el);
      };
      h = requestAnimationFrame(tick);
      pumpCancel = () => cancelAnimationFrame(h);
    }
  }

  function updatePlayButton() {
    const el = activeSlot().el;
    const playing = mode === 'video' && !el.paused && !el.ended;
    playPauseBtn.innerHTML = `<i class="fas fa-${playing ? 'pause' : 'play'}"></i> `;
  }

  function stopVideo() {
    mode = 'image';
    stopPump();
    clearTimeout(autoNextTimer);
    slots.forEach(resetSlot);
    updatePlayButton();
  }

  let autoNextTimer = 0;
  function scheduleAutoNext() {
    clearTimeout(autoNextTimer);
    if (!autoNext || mode !== 'video') return;
    autoNextTimer = setTimeout(function fire() {
      if (!autoNext || mode !== 'video') return;
      if (document.hidden) { autoNextTimer = setTimeout(fire, 5000); return; }
      randomVideo();
    }, CONFIG.AUTO_NEXT_MS);
  }

  async function activate(slot, preloadNext) {
    const old = activeSlot();
    slot.loading = null;
    activeIdx = slots.indexOf(slot);
    mode = 'video';
    sizeVideoCanvas(slot.el);
    vctx.drawImage(slot.el, 0, 0, videoCanvas.width, videoCanvas.height);
    if (!fx) await createFx(videoCanvas);
    else if (typeof fx.setBackgroundFrame === 'function') fx.setBackgroundFrame(videoCanvas);
    else await fx.setBackground(videoCanvas);
    startPump(slot);
    if (old !== slot) resetSlot(old);               // release previous decoder/connection
    rememberVideo(slot.url);
    updatePlayButton();
    scheduleAutoNext();
    if (preloadNext) preloadNextVideo();
  }

  // 'ok' | 'fail' | 'stale'
  async function openVideo(url, opts = {}) {
    const token = opts.token || ++reqToken;
    const cur = activeSlot();
    if (mode === 'video' && cur.url === url && !cur.el.error) {      // already showing it: do NOT reload
      if (cur.el.paused) cur.el.play().catch(() => {});
      return 'ok';
    }
    const slot = standbySlot();
    let p = slot.loading && slot.loading.url === url ? slot.loading.promise : null;   // reuse preloaded copy
    if (!p) { resetSlot(slot); p = startLoad(slot, url, opts.objectUrl || null); }
    showLoading();
    let result;
    try { result = await p; } finally { hideLoading(); }
    if (result !== 'ok') return result === 'cancel' ? 'stale' : 'fail';
    if (token !== reqToken) return 'stale';
    try { await slot.el.play(); } catch (err) { console.warn('play() was blocked:', err && err.message); }
    if (token !== reqToken) return 'stale';
    if (opts.random && !(await isStaticShot(slot.el))) {          // moving camera -> skip this clip
      console.warn('Skipping clip with camera movement:', url);
      resetSlot(slot);
      return token !== reqToken ? 'stale' : 'fail';
    }
    if (token !== reqToken) return 'stale';
    await activate(slot, !!opts.random);
    return 'ok';
  }

  async function playVideoUrl(url) {
    if (!url) { shake(); return; }
    const r = await openVideo(url);
    if (r === 'fail') {
      alert('Failed to load video from URL.\n\nTIP: Check if:\n- URL is valid\n- Video server supports CORS\n- File format is supported');
    }
  }

  async function playVideoFile(file) {
    const objectUrl = URL.createObjectURL(file);
    const r = await openVideo(objectUrl, { objectUrl });
    if (r === 'fail') { URL.revokeObjectURL(objectUrl); alert('Failed to load video file'); }
  }

  /* ---------- online video pool (automatic random source) ---------- */
  const pool = new Set(CURATED_VIDEOS);
  const badVideos = new Set();          // links that failed (dead / no CORS / unsupported)
  const history = [];                   // recently played => no immediate repeats
  let githubLoaded = false, refilling = null, lastRefill = 0;

  function rememberVideo(url) {
    if (!url || url.startsWith('blob:')) return;
    const i = history.indexOf(url);
    if (i >= 0) history.splice(i, 1);
    history.push(url);
    while (history.length > CONFIG.HISTORY_SIZE) history.shift();
  }

  function addToPool(urls) {
    for (const u of urls || []) {
      const t = typeof u === 'string' ? u.trim() : '';
      if (/^https?:\/\//i.test(t) && !badVideos.has(t)) pool.add(t);
    }
    while (pool.size > CONFIG.POOL_MAX) pool.delete(pool.values().next().value);
  }

  async function fetchGithubList() {
    const res = await fetch(CONFIG.GITHUB_LIST, { signal: timeoutSignal(8000) });
    if (!res.ok) throw new Error('GitHub list HTTP ' + res.status);
    return (await res.text()).split(/\r?\n/).map((s) => s.trim()).filter((s) => s && !s.startsWith('#'));
  }

  let testerEl = null;
  const canPlay = (type) => {
    testerEl = testerEl || document.createElement('video');
    return !!type && !!testerEl.canPlayType(type);
  };

  // Wikimedia Commons: no API key, CORS-enabled (origin=*), pre-transcoded small versions (360p/480p...)
  function pickCommonsFile(info) {
    const cands = [];
    for (const d of info.derivatives || []) {
      if (d && d.src && canPlay(d.type)) cands.push({ url: d.src, h: parseInt(d.height, 10) || 0 });
    }
    if (!cands.length && info.url && info.mediatype === 'VIDEO' && canPlay(info.mime) && (info.size || 0) < 30e6) {
      cands.push({ url: info.url, h: info.height || 0 });
    }
    if (!cands.length) return null;
    // smallest file that is still >= 360p, otherwise the biggest available
    cands.sort((a, b) => ((a.h >= 360) === (b.h >= 360)) ? (a.h >= 360 ? a.h - b.h : b.h - a.h) : (a.h >= 360 ? -1 : 1));
    return cands[0].url;
  }

  async function fetchCommonsBatch() {
    const term = pickRandom(CONFIG.COMMONS_QUERIES);
    const query = async (offset) => {
      const qs = new URLSearchParams({
        action: 'query', format: 'json', formatversion: '2', origin: '*',
        generator: 'search', gsrsearch: `${term} filetype:video ${CONFIG.EXCLUDE_VIDEO}`, gsrnamespace: '6',
        gsrlimit: '30', gsroffset: String(offset),
        prop: 'videoinfo', viprop: 'url|size|mediatype|mime|derivatives'
      });
      const res = await fetch('https://commons.wikimedia.org/w/api.php?' + qs, { signal: timeoutSignal(8000) });
      if (!res.ok) throw new Error('Commons HTTP ' + res.status);
      const json = await res.json();
      return (json.query && json.query.pages) || [];
    };
    let pages = await query(Math.floor(Math.random() * 120));
    if (!pages.length) pages = await query(0);                 // random offset was past the last hit
    const urls = [];
    for (const p of pages) {
      const info = (p.videoinfo || p.imageinfo || [])[0];
      const u = info && pickCommonsFile(info);
      if (u) urls.push(u);
    }
    return urls;
  }

  const pexelsKey = () => {
    if (CONFIG.PEXELS_API_KEY) return CONFIG.PEXELS_API_KEY;
    try { return localStorage.getItem('pexelsKey') || ''; } catch (_) { return ''; }
  };

  async function fetchPexelsBatch() {
    const q = encodeURIComponent(pickRandom(CONFIG.PEXELS_QUERIES));
    const page = 1 + Math.floor(Math.random() * 8);
    const res = await fetch(`https://api.pexels.com/videos/search?query=${q}&per_page=40&page=${page}&orientation=landscape`,
      { headers: { Authorization: pexelsKey() }, signal: timeoutSignal(8000) });
    if (!res.ok) throw new Error('Pexels HTTP ' + res.status);
    const json = await res.json();
    const urls = [];
    for (const v of json.videos || []) {
      const files = (v.video_files || []).filter((f) => f.file_type === 'video/mp4' && f.width >= 640 && f.width <= 1280);
      files.sort((a, b) => Math.abs(a.width - 960) - Math.abs(b.width - 960));
      if (files[0]) urls.push(files[0].link);
    }
    return urls;
  }

  function refillPool() {
    if (refilling) return refilling;
    lastRefill = Date.now();
    refilling = (async () => {
      const jobs = [fetchCommonsBatch(), fetchCommonsBatch()];
      if (!githubLoaded) jobs.push(fetchGithubList().then((l) => { githubLoaded = true; return l; }));
      if (pexelsKey()) jobs.push(fetchPexelsBatch());
      for (const r of await Promise.allSettled(jobs)) {
        if (r.status === 'fulfilled') addToPool(r.value);
        else console.warn('Video source failed:', (r.reason && r.reason.message) || r.reason);
      }
    })().finally(() => { refilling = null; });
    return refilling;
  }

  function pickCandidate() {
    const alive = [...pool].filter((u) => !badVideos.has(u));
    const fresh = alive.filter((u) => !history.includes(u));
    if (fresh.length < 3 && Date.now() - lastRefill > 10000) refillPool();     // top up in background
    const list = fresh.length ? fresh : alive;
    return list.length ? pickRandom(list) : null;
  }

  // Static-camera check: sample 32x18 luma frames ~0.35s apart; panning/zooming/shaky shots change almost
  // every pixel, a fixed camera (rain, leaves, waves, small movers) changes little.
  async function isStaticShot(el) {
    const c = document.createElement('canvas');
    c.width = 32; c.height = 18;
    const g = c.getContext('2d', { willReadFrequently: true });
    const grab = () => {
      g.drawImage(el, 0, 0, 32, 18);
      const d = g.getImageData(0, 0, 32, 18).data, out = new Float32Array(576);
      for (let i = 0; i < 576; i++) out[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
      return out;
    };
    try {
      let prev = grab(), sum = 0, n = 0;
      for (let k = 1; k < CONFIG.STATIC_SAMPLES; k++) {
        await sleep(350);
        const cur = grab();
        let t = 0;
        for (let i = 0; i < 576; i++) t += Math.abs(cur[i] - prev[i]);
        sum += t / 576; n++; prev = cur;
      }
      const mean = sum / n;
      isStaticShot.last = mean;
      return mean <= CONFIG.STATIC_MAX_MEAN_DIFF;
    } catch (_) { return true; }                // cannot read pixels -> do not block
  }

  function preloadNextVideo() {                  // next random clip buffers in the standby <video>
    if (slowNetwork() || document.hidden) return;
    const slot = standbySlot();
    if (slot.loading) return;
    const url = pickCandidate();
    if (url) startLoad(slot, url);
  }

  async function randomVideo() {
    const token = ++reqToken;
    for (let attempt = 0; attempt < CONFIG.MAX_ATTEMPTS; attempt++) {
      const slot = standbySlot();
      let url = slot.loading && slot.loading.url;           // preloaded/preloading candidate first
      if (!url) {
        url = pickCandidate();
        if (!url) {
          await refillPool();
          if (token !== reqToken) return false;
          url = pickCandidate();
        }
        if (!url) break;
      }
      const r = await openVideo(url, { token, random: true });
      if (r === 'ok') return true;
      if (r === 'stale' || token !== reqToken) return false;
      badVideos.add(url);                                   // dead link -> skip it and try another
      console.warn('Skipping unplayable video:', url);
    }
    shake();
    return false;
  }

  /* ======================================================================
   * CONTROLS
   * ==================================================================== */
  const showPanel = () => controlPanel.classList.add('show');
  const hidePanel = () => controlPanel.classList.remove('show');
  controlPanel.addEventListener('mouseenter', showPanel);
  controlPanel.addEventListener('mouseleave', hidePanel);
  controlPanel.querySelectorAll('input, button').forEach((c) => c.addEventListener('focus', showPanel));

  const dropletsSlider = $('dropletsPerSecond'), dropletsValue = $('dropletsPerSecondValue');
  dropletsSlider.addEventListener('input', () => {
    const v = parseInt(dropletsSlider.value, 10);
    dropletsValue.textContent = v;
    if (fx) fx.options.dropletsPerSecond = v;
  });

  const spawnSizeSlider = $('spawnSize'), spawnSizeValue = $('spawnSizeValue');
  spawnSizeSlider.addEventListener('input', () => {
    const v = parseInt(spawnSizeSlider.value, 10);
    const min = Math.max(10, v - 25), max = Math.min(200, v + 25);
    spawnSizeValue.textContent = `[${min}, ${max}]`;
    if (fx) fx.options.spawnSize = [min, max];
  });

  const slipRateSlider = $('slipRate'), slipRateValue = $('slipRateValue');
  slipRateSlider.addEventListener('input', () => {
    const v = parseFloat(slipRateSlider.value) / 100;
    slipRateValue.textContent = v.toFixed(2);
    if (fx) fx.options.slipRate = v;
  });

  const gravitySlider = $('gravity'), gravityValue = $('gravityValue');
  gravitySlider.addEventListener('input', () => {
    const v = parseInt(gravitySlider.value, 10);
    gravityValue.textContent = v;
    if (fx) fx.options.gravity = v;
  });

  const mistToggle = $('mistToggle');
  function updateMistToggle() {
    if (!fx) return;
    mistToggle.classList.toggle('active', !!fx.options.mist);
    mistToggle.textContent = fx.options.mist ? 'ON' : 'OFF';
  }
  mistToggle.addEventListener('click', () => {
    if (!fx) return;
    fx.options.mist = !fx.options.mist;
    if (fx.options.mist) {
      fx.options.mistColor = [0.02, 0.02, 0.02, 0.8];
      fx.options.mistTime = 0.5;
      fx.options.mistBlurStep = 4;
    }
    try { fx.renderer.blurBackground(); } catch (_) { /* keep going */ }   // refresh mist/blur buffers for current bg
    updateMistToggle();
  });

  function updateSliderValues() {
    if (!fx) return;
    const o = fx.options;
    dropletsSlider.value = o.dropletsPerSecond;
    dropletsValue.textContent = o.dropletsPerSecond;
    const avg = Math.round((o.spawnSize[0] + o.spawnSize[1]) / 2);
    spawnSizeSlider.value = avg;
    spawnSizeValue.textContent = `[${o.spawnSize[0]}, ${o.spawnSize[1]}]`;
    slipRateSlider.value = o.slipRate * 100;
    slipRateValue.textContent = o.slipRate.toFixed(2);
    gravitySlider.value = o.gravity;
    gravityValue.textContent = o.gravity;
    updateMistToggle();
  }

  function applyPreset(preset) {
    if (!fx) return;
    document.querySelectorAll('.preset-btn').forEach((b) => b.classList.toggle('active', b.dataset.preset === preset));
    const o = fx.options;
    switch (preset) {
      case 'light': o.dropletsPerSecond = 300;  o.spawnSize = [15, 40];  o.slipRate = 0.3; o.gravity = 2000; break;
      case 'heavy': o.dropletsPerSecond = 1500; o.spawnSize = [50, 100]; o.slipRate = 0.7; o.gravity = 2800; break;
      case 'storm': o.dropletsPerSecond = 2500; o.spawnSize = [60, 150]; o.slipRate = 0.9; o.gravity = 3500; break;
      case 'norain':
        o.dropletsPerSecond = 0;
        o.spawnSize = [0, 0];
        break;
    }
    updateSliderValues();
  }
  document.querySelectorAll('.preset-btn[data-preset]').forEach((b) =>
    b.addEventListener('click', () => applyPreset(b.dataset.preset)));

  /* ---------- fullscreen ---------- */
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  const syncFsButton = () => {
    fullscreenBtn.innerHTML = fsElement()
      ? '<i class="fas fa-compress"></i> Exit Fullscreen'
      : '<i class="fas fa-expand"></i> Enter Fullscreen';
  };
  async function enterFullscreen() {
    try {
      const fn = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
      if (fn) await fn.call(root);
    } catch (err) { console.log('Fullscreen request failed:', err); }
    syncFsButton();
  }
  function exitFullscreen() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (fsElement() && fn) fn.call(document);
    syncFsButton();
  }
  fullscreenBtn.addEventListener('click', () => (fsElement() ? exitFullscreen() : enterFullscreen()));
  document.addEventListener('fullscreenchange', syncFsButton);
  document.addEventListener('webkitfullscreenchange', syncFsButton);

  if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    const once = () => { enterFullscreen(); };
    canvas.addEventListener('click', once, { once: true });
    document.addEventListener('touchstart', once, { once: true, passive: true });
  }

  /* ---------- images: buttons / tap / long-press ---------- */
  $('changeBgBtn').addEventListener('click', () => showRandomImage());

  const bgFileInput = document.createElement('input');
  bgFileInput.type = 'file';
  bgFileInput.accept = 'image/*';
  bgFileInput.style.display = 'none';
  document.body.appendChild(bgFileInput);
  $('customBgBtn').addEventListener('click', (e) => { e.stopPropagation(); bgFileInput.click(); });
  bgFileInput.addEventListener('change', (e) => {
    e.stopPropagation();
    const f = bgFileInput.files[0];
    if (f) showImageFile(f);
    bgFileInput.value = '';
  });

  let pressTimer = null, longPressed = false, lastSwitch = 0;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  canvas.addEventListener('touchstart', (e) => {
    cancelPress();
    if (e.touches.length === 1) {
      longPressed = false;
      pressTimer = setTimeout(() => { longPressed = true; bgFileInput.click(); }, 600);
    }
  }, { passive: true });
  canvas.addEventListener('touchend', cancelPress);
  canvas.addEventListener('touchcancel', cancelPress);
  canvas.addEventListener('touchmove', cancelPress, { passive: true });
  canvas.addEventListener('click', (e) => {          // tap / click = next random background of the current type
    if (longPressed) { longPressed = false; return; }
    if (e.target !== canvas) return;
    const now = Date.now();
    if (now - lastSwitch < 350) return;              // ignore click-spam
    lastSwitch = now;
    if (mode === 'video') randomVideo(); else showRandomImage();
  });

  /* ---------- video: buttons ---------- */
  $('videoLoadBtn').addEventListener('click', () => playVideoUrl(urlInput.value.trim()));
  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') playVideoUrl(urlInput.value.trim()); });
  $('randomVideoBtn').addEventListener('click', () => randomVideo());

  const videoFileInput = document.createElement('input');
  videoFileInput.type = 'file';
  videoFileInput.accept = 'video/*';
  videoFileInput.style.display = 'none';
  document.body.appendChild(videoFileInput);
  $('videoUploadBtn').addEventListener('click', (e) => { e.stopPropagation(); videoFileInput.click(); });
  videoFileInput.addEventListener('change', (e) => {
    e.stopPropagation();
    const f = videoFileInput.files[0];
    if (f) playVideoFile(f);
    videoFileInput.value = '';
  });

  playPauseBtn.addEventListener('click', () => {
    if (mode !== 'video') { shake(); return; }
    const el = activeSlot().el;
    if (el.paused) el.play().catch((err) => console.error('Play error:', err));
    else el.pause();
  });

  autoNextBtn.addEventListener('click', () => {
    autoNext = !autoNext;
    autoNextBtn.classList.toggle('active', autoNext);
    autoNextBtn.textContent = autoNext ? 'ON' : 'OFF';
    if (autoNext && mode !== 'video') randomVideo(); else scheduleAutoNext();
  });

  // pause decoding while the tab is hidden (saves CPU/battery), resume afterwards
  let resumeOnShow = false;
  document.addEventListener('visibilitychange', () => {
    if (mode !== 'video') return;
    const el = activeSlot().el;
    if (document.hidden) { resumeOnShow = !el.paused; el.pause(); }
    else if (resumeOnShow) { resumeOnShow = false; el.play().catch(() => {}); }
  });

  /* ---------- drag & drop ---------- */
  document.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('active'); });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (e.target === dropzone) dropzone.classList.remove('active');
  });
  document.addEventListener('drop', (e) => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('active');
    const dt = e.dataTransfer;
    if (!dt) return;
    if (dt.files && dt.files.length > 0) {
      const f = dt.files[0];
      if (f.type.startsWith('video/')) playVideoFile(f);
      else if (f.type.startsWith('image/')) showImageFile(f);
      return;
    }
    const url = dt.getData('URL') || dt.getData('text/plain');
    if (/^https?:\/\//i.test(url)) {
      if (isVideoUrl(url)) playVideoUrl(url);
      else showImage(() => loadImage(url), { attempts: 2 });
    }
  });

  /* ---------- cleanup ---------- */
  window.addEventListener('pagehide', () => {
    stopVideo();
    if (fx && typeof fx.stop === 'function') fx.stop();
  });

  /* ======================================================================
   * START
   * ==================================================================== */
  window.RainApp = {                                   // handy for debugging in the console
    get fx() { return fx; }, get mode() { return mode; },
    randomVideo, showRandomImage, openVideo, refillPool, isStaticShot, pool, badVideos, imagePool
  };

  (async () => {
    resizeCanvas();
    await showRandomImage();
    setTimeout(() => refillPool().catch(() => {}), 1500);     // warm the online video pool while idle
  })();
})();
  </script>
</body>
</html>
